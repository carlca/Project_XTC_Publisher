meta:
   name: "Project XTC Default"
   version: "0.1"
page:
   size: A4
   margins_mm: { top: 20, right: 22, bottom: 22, left: 22 }
fonts:
   preferred: ["DejaVu Sans", "Liberation Sans", "Helvetica"]
colours:
   text: "#000000"
   subtitle: "#666666"
   heading: "#777777"
   rule: "#D0D0D0"
typography:
   book_title:
      {
         font_size_pt: 27,
         leading_pt: 31,
         alignment: left,
         colour: "#000000",
         space_after_pt: 12,
      }
   book_subtitle:
      {
         font_size_pt: 15,
         leading_pt: 18,
         alignment: left,
         colour: "#666666",
         space_after_pt: 22,
      }
   chapter_title:
      {
         font_size_pt: 20,
         leading_pt: 24,
         alignment: left,
         colour: "#000000",
         space_after_pt: 12,
      }
   section_heading:
      {
         font_size_pt: 17,
         leading_pt: 20,
         colour: "#a0a0a0",
         space_before_pt: 12,
         space_after_pt: 6,
         keep_with_next: true,
      }
   subsection_heading:
      {
         font_size_pt: 13,
         leading_pt: 16,
         colour: "#777777",
         space_before_pt: 9,
         space_after_pt: 4,
         keep_with_next: true,
      }
   body:
      {
         font_size_pt: 11.5,
         leading_pt: 16,
         colour: "#000000",
         paragraph_after_pt: 8,
      }
   caption:
      { font_size_pt: 9.5, leading_pt: 12, alignment: left, colour: "#666666" }
directives:
   field-note:
      {
         label: "Field Note",
         background: "#F3F3F3",
         border_colour: "#B8B8B8",
         padding_pt: 9,
      }
   reality-check:
      {
         label: "Reality Check",
         background: "#FFF8E6",
         border_colour: "#C9A227",
         padding_pt: 9,
      }
   exercise:
      {
         label: "Exercise",
         background: "#EEF5FB",
         border_colour: "#7A9DB8",
         padding_pt: 9,
      }
   tip:
      {
         label: "Tip",
         background: "#F1F7F1",
         border_colour: "#7F9F7F",
         padding_pt: 9,
      }
   warning:
      {
         label: "Warning",
         background: "#FFF0F0",
         border_colour: "#B26A6A",
         padding_pt: 9,
      }
pagination:
   keep_heading_with_next: true
   minimum_lines_after_heading: 2
output:
   pdf:
      metadata:
         title: "Project XTC: X-Touch Companion"
         author: "Project XTC"
         subject: "Behringer X-Touch, Bitwig Studio and DrivenByMoss"

tables:
   header_background: "#EEEEEE"
   border_colour: "#BFBFBF"
   border_width_pt: 0.5
   cell_padding_pt: 5
   repeat_header: true
